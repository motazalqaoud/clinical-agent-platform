name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov=clinagent --cov-report=term-missing

  eval-gate:
    # The evaluation suite is a required check: a change that leaks PHI, repeats an
    # injection payload, or regresses retrieval/refusal below its floor cannot merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run evaluation and enforce thresholds
        run: clinagent eval --out reports
      - name: Publish report to the job summary
        if: always()
        run: cat reports/eval.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: [test, eval-gate]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clinagent:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 clinagent:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/ask -H 'content-type: application/json' \
            -d '{"question":"What oxygen saturation target in acute asthma?"}' | tee /tmp/out.json
          python3 -c "import json; assert json.load(open('/tmp/out.json'))['grounded']"
