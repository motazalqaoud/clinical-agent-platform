[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clinagent"
version = "0.1.0"
description = "A deployable clinical question-answering service: guideline retrieval, FHIR patient context, guardrails and an evaluation gate in CI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Motaz Alqaoud" }]
keywords = ["clinical-ai", "rag", "fhir", "llm", "agents", "evaluation", "guardrails", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# Dense embeddings with a sentence-transformers model instead of the offline hashing embedder.
dense = ["sentence-transformers>=2.7"]
# Run a local Hugging Face model in-process (CPU or GPU).
local-llm = ["transformers>=4.40", "torch>=2.2"]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "mcp>=2.0"]

[project.scripts]
clinagent = "clinagent.cli:main"

[project.urls]
Homepage = "https://github.com/motazalqaoud/clinical-agent-platform"

[tool.hatch.build.targets.wheel]
packages = ["src/clinagent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is enforced by `ruff format`

[tool.mypy]
python_version = "3.11"
packages = ["clinagent"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
