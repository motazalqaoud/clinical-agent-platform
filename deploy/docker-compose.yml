# Local stack: the API, a HAPI FHIR R4 server, and (optional) a local LLM via Ollama.
#
#   docker compose -f deploy/docker-compose.yml up -d fhir api
#   python scripts/load_fhir_bundles.py --server http://localhost:8080/fhir data/fhir
#
# To answer with a local model instead of the extractive baseline:
#   docker compose -f deploy/docker-compose.yml --profile llm up -d
#   docker compose -f deploy/docker-compose.yml exec ollama ollama pull qwen2.5:3b-instruct
#   then set CLINAGENT_LLM=openai:qwen2.5:3b-instruct@http://ollama:11434/v1 on the api service.
services:
  fhir:
    image: hapiproject/hapi:latest
    ports: ["8080:8080"]
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"

  api:
    build: ..
    ports: ["8000:8000"]
    environment:
      CLINAGENT_FHIR: http://fhir:8080/fhir
      CLINAGENT_LLM: ${CLINAGENT_LLM:-extractive}
      CLINAGENT_API_KEY: ${CLINAGENT_API_KEY:-}
    depends_on: [fhir]

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  ollama:
